name: Measure Lead Time

on:
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, closed, converted_to_draft, ready_for_review]

jobs:
  measure-lead-time:
    runs-on: ubuntu-latest
    
    permissions:
      issues: read
      pull-requests: read
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyGithub python-dateutil

      - name: Calculate and record lead time
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/measure_lead_time.py

      - name: Check for changes
        id: verify-changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "docs: update lead time metrics [skip ci]"
          git push

      - name: Post lead time to issue
        if: github.event_name == 'issues' && github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metricsPath = '.github/metrics/lead_time_metrics.json';
            
            let metrics = {};
            if (fs.existsSync(metricsPath)) {
              const content = fs.readFileSync(metricsPath, 'utf8');
              metrics = JSON.parse(content);
            }
            
            const issueNumber = context.issue.number;
            const issueMetric = metrics[issueNumber];
            
            if (issueMetric && issueMetric.lead_time_hours) {
              const hours = issueMetric.lead_time_hours;
              const days = (hours / 24).toFixed(2);
              
              github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `⏱️ **Lead Time**: ${hours} hours (${days} days)\n\n- Created: ${issueMetric.created_at}\n- Closed: ${issueMetric.closed_at}`
              });
            }
